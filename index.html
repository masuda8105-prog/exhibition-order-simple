<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="展示会注文">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>展示会 注文書作成</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <section id="connectionView" class="login" aria-live="polite">
    <div class="loginBox"><h1>展示会注文</h1><p id="connectionMessage">ログイン状態を確認しています…</p><button id="retryConnection" class="primary" type="button" disabled>再接続</button></div>
  </section>
  <section id="loginView" class="login hidden">
    <form id="loginForm" class="loginBox">
      <div class="brandMark" aria-hidden="true">SN</div>
      <h1>展示会 注文書作成</h1>
      <p>登録スタッフでログインしてください。一度ログインすると、この端末ではログイン状態を保持します。</p>
      <label for="loginEmail">メール</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
      <label for="loginPassword">パスワード</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit" class="primary">ログイン</button>
      <div id="loginMessage" class="errorText" role="alert"></div>
    </form>
  </section>

  <div id="appView" class="app hidden">
    <header class="topbar">
      <div class="brandRow"><div><div class="eyebrow">SAN NISHIMURA</div><h1>展示会注文</h1></div></div>
      <div class="sessionLine">
        <span id="syncDot" class="syncDot busy" aria-hidden="true"></span>
        <span id="syncStatus">同期を確認中…</span>
        <span id="staffName">スタッフ確認中</span>
        <button id="logoutButton" class="linkBtn" type="button">ログアウト</button>
      </div>
    </header>
    <main class="homePanel">
      <div class="historySummary"><div><small>保存済み注文</small><b id="orderCount">0件</b></div><button id="refreshOrders" class="secondary compact" type="button">同期</button></div>
      <div class="orderSearchWrap"><label class="srOnly" for="orderSearch">注文を検索</label><input id="orderSearch" type="search" placeholder="お渡し番号・店舗名・お客様名・品番で検索" autocomplete="off"></div>
      <section id="orderHistory" class="orderHistory" aria-label="注文履歴"></section>
    </main>
    <button id="newOrderButton" class="newOrderBtn" type="button">＋ 新しい注文</button>
  </div>

  <section id="receiptView" class="receiptPage hidden">
    <div class="receiptToolbar">
      <div>
        <div class="eyebrow">PRINT PREVIEW</div>
        <h2>注文書プレビュー</h2>
      </div>
      <span>A4縦・ブラウザ印刷</span>
    </div>
    <article id="receiptCard" class="receiptSheet" aria-label="展示会注文書"></article>
    <p id="printPrivacyNotice" class="printPrivacyNotice">この注文は共有注文履歴へ保存済みです。印刷画面を閉じても入力内容は消えません。</p>
    <div id="receiptOperations"></div>
    <div id="receiptActions" class="receiptActions">
      <button id="backToEditButton" class="secondary" type="button">戻って修正</button>
      <button id="printButton" class="primary" type="button">印刷</button>
    </div>
    <div id="printedActions" class="printedActions">
      <p>注文内容は保存されています。</p>
      <button id="backToHistoryButton" class="secondary" type="button">注文一覧へ</button>
      <button id="startNextOrderButton" class="primary" type="button">新しい注文を始める</button>
    </div>
  </section>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div id="sheetPanel" class="sheetPanel">
      <header class="sheetHead">
        <div>
          <small id="stepLabel"></small>
          <h2 id="sheetTitle">新しい注文</h2>
        </div>
        <button id="closeSheetButton" type="button" class="iconBtn" aria-label="閉じる">×</button>
      </header>
      <div id="sheetError" class="errorBox hidden" role="alert"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
